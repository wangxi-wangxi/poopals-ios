workflows:
  ios-simulator:
    name: Poopals - iOS simulator check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Test calendar and local records
        script: |
          set -euo pipefail
          mkdir -p build/module-cache
          swiftc -module-cache-path build/module-cache Poopals/Record.swift Tests/CoreTests.swift -o build/core-tests
          ./build/core-tests
          swiftc -module-cache-path build/module-cache Poopals/Record.swift Poopals/CloudModels.swift Tests/CloudModelTests.swift -o build/cloud-tests
          ./build/cloud-tests
          swiftc -target "$(uname -m)-apple-macosx14.0" -module-cache-path build/module-cache Poopals/Record.swift Poopals/CloudModels.swift Poopals/AppStore.swift Tests/AccountStoreTests.swift -o build/account-tests
          ./build/account-tests
      - name: Build unsigned iOS simulator app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project Poopals.xcodeproj \
            -scheme Poopals \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log
      - name: Package simulator artifact
        script: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/Poopals.app build/Poopals-simulator.zip
    artifacts:
      - build/Poopals-simulator.zip
      - build/xcodebuild.log
